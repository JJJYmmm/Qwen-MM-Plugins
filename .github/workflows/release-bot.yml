name: Release bot

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [closed]

permissions:
  contents: read

# Keep publication serialized without dropping pending release requests.
concurrency:
  group: release-bot
  queue: max

jobs:
  request:
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       (startsWith(github.event.comment.body, '/release') ||
        startsWith(github.event.comment.body, '/publish') ||
        startsWith(github.event.comment.body, '@github-actions'))) ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged &&
       github.event.pull_request.base.ref == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      head: ${{ steps.request.outputs.head }}
      number: ${{ steps.request.outputs.number }}
      comment: ${{ steps.request.outputs.comment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - id: request
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_bot.py event

  verify:
    needs: request
    if: needs.request.outputs.head != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.request.outputs.head }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.9"
          python-version: "3.12"
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Run offline tests on the exact release commit
        run: >-
          uv run --no-project --python 3.12
          --with pytest --with "mcp>=1,<2" --with "anyio>=4,<5"
          --with "docstring-parser>=0.18,<0.19" --with "pydantic>=2"
          --with "pillow<12" --with "numpy<3" --with scipy --with matplotlib
          --with opencv-python-headless --with "nibabel>=5,<6" --with requests
          --with "msgpack>=1.1,<2" --with openai --with pyyaml
          python -m pytest -q -m "not reachability"
      - name: Check manifests and package
        run: |
          python3 scripts/check_manifests.py
          bash -n install.sh
          uv build --wheel --python 3.12

  publish:
    needs: [request, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Publish tags, then merge the version PR
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_HEAD: ${{ needs.request.outputs.head }}
          RELEASE_PR: ${{ needs.request.outputs.number }}
          RELEASE_COMMENT: ${{ needs.request.outputs.comment }}
        run: >-
          python3 scripts/release_bot.py publish
          --number "$RELEASE_PR" --comment "$RELEASE_COMMENT" --head "$RELEASE_HEAD"
