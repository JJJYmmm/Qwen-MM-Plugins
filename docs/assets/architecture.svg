  <text class="primary" x="660" y="379" text-anchor="middle" font-size="30" font-weight="600">MCP server</text>
  <text class="secondary" x="660" y="413" text-anchor="middle" font-size="20">optional</text>

  <path class="connector" d="M820 306 H853 M846 299 L853 306 L846 313"/>

