<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="500" viewBox="0 0 1320 500" role="img" aria-labelledby="architecture-title architecture-description">
  <title id="architecture-title">Qwen-MM-Plugins architecture</title>
  <desc id="architecture-description">Capabilities such as core, api, video-memory, video-edit, and blender each ship as an independently installed plugin: a Skill plus an optional MCP server. Plugins integrate with agent harnesses such as Claude Code, Codex, Qwen Code, Qoder, and OpenClaw. Ellipsis cards indicate additional plugins and harnesses; these examples are not a complete catalog.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
    .canvas { fill: #ffffff; stroke: #e4e7ee; }
    .panel { fill: #f8f9fc; stroke: #e4e7ee; }
    .tile, .component { fill: #ffffff; stroke: #dfe4ee; }
    .more { fill: none; stroke: #c6cedd; stroke-dasharray: 5 5; }
    .plugin-panel { fill: #f5f1ff; stroke: #cfbfff; }
    .primary { fill: #172033; }
    .secondary { fill: #596579; }
    .muted { fill: #6c788b; }
    .accent { fill: #6941d9; }
    .brand { fill: #273244; }
    .connector { fill: none; stroke: #8e79b6; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .canvas { fill: #10131c; stroke: #2b3241; }
      .panel { fill: #161b26; stroke: #2b3241; }
      .tile, .component { fill: #1e2533; stroke: #353e50; }
      .more { stroke: #58647b; }
      .plugin-panel { fill: #231d35; stroke: #594581; }
      .primary { fill: #f0f2f7; }
      .secondary { fill: #bbc3d4; }
      .muted { fill: #a0acc0; }
      .accent { fill: #c3a7ff; }
      .brand { fill: #e0e5ef; }
      .connector { stroke: #aa94d0; }
    }
  </style>

  <rect class="canvas" x="0.5" y="0.5" width="1319" height="499" rx="24"/>
  <rect class="accent" x="36" y="38" width="5" height="36" rx="2.5"/>
  <text class="primary" x="56" y="67" font-size="34" font-weight="700" letter-spacing="-0.8">Qwen-MM-Plugins</text>

  <!-- Representative examples: the ellipsis keeps this from becoming a second catalog. -->
  <text class="primary" x="36" y="120" font-size="24" font-weight="600">Capabilities</text>
  <rect class="panel" x="36.5" y="144.5" width="419" height="321" rx="16"/>
  <g data-capability="core">
    <rect class="tile" x="56.5" y="164.5" width="181" height="81" rx="12"/>
    <text class="primary mono" x="147" y="212" text-anchor="middle" font-size="22" font-weight="600">core</text>
  </g>
  <g data-capability="api">
    <rect class="tile" x="254.5" y="164.5" width="181" height="81" rx="12"/>
    <text class="primary mono" x="345" y="212" text-anchor="middle" font-size="22" font-weight="600">api</text>
  </g>
  <g data-capability="video-memory">
    <rect class="tile" x="56.5" y="262.5" width="181" height="81" rx="12"/>
    <text class="primary mono" x="147" y="310" text-anchor="middle" font-size="22" font-weight="600">video-memory</text>
  </g>
  <g data-capability="video-edit">
    <rect class="tile" x="254.5" y="262.5" width="181" height="81" rx="12"/>
    <text class="primary mono" x="345" y="310" text-anchor="middle" font-size="22" font-weight="600">video-edit</text>
  </g>
  <g data-capability="blender">
    <rect class="tile" x="56.5" y="360.5" width="181" height="81" rx="12"/>
    <text class="primary mono" x="147" y="408" text-anchor="middle" font-size="22" font-weight="600">blender</text>
  </g>
  <g data-more="capabilities" aria-label="More plugins">
    <rect class="more" x="254.5" y="360.5" width="181" height="81" rx="12"/>
    <text class="muted" x="345" y="410" text-anchor="middle" font-size="32" letter-spacing="4">···</text>
  </g>

  <path class="connector" d="M466 306 H499 M492 299 L499 306 L492 313"/>

  <!-- MCP is optional; Skill-only capabilities remain valid plugins. -->
  <text class="primary" x="510" y="120" font-size="24" font-weight="600">Plugin</text>
  <rect class="plugin-panel" x="510.5" y="144.5" width="299" height="321" rx="16"/>
  <rect class="component" x="530.5" y="164.5" width="259" height="113" rx="12"/>
